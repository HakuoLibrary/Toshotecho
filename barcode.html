<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バーコード生成サイト</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    padding:20px;
}

input{
    padding:10px;
    font-size:18px;
    width:280px;
}

button{
    padding:10px 14px;
    margin:5px;
    font-size:15px;
    cursor:pointer;
}

#barcodeArea{
    margin-top:25px;
    display:inline-block;
    padding:10px;
    background:white;
}

#value{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<h2>バーコード生成サイト</h2>

<input id="input" placeholder="数字を入力">

<br><br>

<button onclick="copyImage()">画像コピー</button>
<button onclick="downloadPNG()">保存</button>
<button onclick="window.print()">印刷</button>

<div id="barcodeArea">
    <svg id="barcode"></svg>
    <div id="value"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<script>
// ===== リアルタイム生成 =====
const input = document.getElementById("input");

input.addEventListener("input", generate);

function generate(){

    const val = input.value.trim();

    // 空欄ならクリア
    if(val === ""){
        document.getElementById("barcode").innerHTML = "";
        document.getElementById("value").textContent = "";
        return;
    }

    // 数字のみ（元仕様維持）
    if(!/^[0-9]+$/.test(val)){
        return;
    }

    JsBarcode("#barcode", val, {
        format: "CODE39",
        displayValue: true,
        width: 2,
        height: 100,
        margin: 10
    });

    document.getElementById("value").textContent = val;
}
</script>

<script>
// ===== 画像コピー =====
async function copyImage(){

    const svg = document.getElementById("barcode");
    const xml = new XMLSerializer().serializeToString(svg);

    const img = new Image();
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    img.onload = async () => {

        canvas.width = img.width || 300;
        canvas.height = img.height || 150;

        ctx.drawImage(img,0,0);

        try {
            const blob = await new Promise(resolve =>
                canvas.toBlob(resolve)
            );

            await navigator.clipboard.write([
                new ClipboardItem({ "image/png": blob })
            ]);

            alert("バーコード画像をコピーしました");

        } catch (e) {
            alert("このブラウザでは画像コピーに対応していません");
        }
    };

    img.src =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(xml);
}
</script>

<script>
// ===== PNGダウンロード =====
function downloadPNG(){

    const svg = document.getElementById("barcode");
    const xml = new XMLSerializer().serializeToString(svg);

    const img = new Image();
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    img.onload = function(){

        canvas.width = img.width || 300;
        canvas.height = img.height || 150;

        ctx.drawImage(img,0,0);

        const a = document.createElement("a");
        a.download = "barcode.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
    };

    img.src =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(xml);
}
</script>

</body>
</html>
