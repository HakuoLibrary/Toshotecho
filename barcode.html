<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バーコード生成サイト</title>

<!-- やさしさゴシック -->

<style>
@font-face{
    font-family:"やさしさゴシック";
    src:url("./やさしさゴシック.otf") format("opentype");
    font-weight:normal;
    font-style:normal;
}

body{
    font-family:"やさしさゴシック", sans-serif;
    text-align:center;
    padding:20px;
}

input{
    padding:10px;
    font-size:18px;
    width:280px;
    font-family:"やさしさゴシック", sans-serif;
}

button{
    padding:10px 14px;
    margin:5px;
    font-size:15px;
    cursor:pointer;
    font-family:"やさしさゴシック", sans-serif;
}

#barcodeArea{
    margin-top:25px;
    display:inline-block;
    padding:10px;
    background:white;
}

#barcode text{
    font-family:"やさしさゴシック" !important;
}

#value{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
    font-family:"やさしさゴシック", sans-serif;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

</head>
<body>

<h2>バーコード生成サイト</h2>

<input id="input" placeholder="数字を入力">

<br><br>

<button onclick="copyImage()">画像コピー</button> <button onclick="downloadPNG()">保存</button> <button onclick="window.print()">印刷</button>

<div id="barcodeArea">
    <svg id="barcode"></svg>
    <div id="value"></div>
</div>

<script>
// ===== リアルタイム生成 =====
const input = document.getElementById("input");

input.addEventListener("input", generate);

function generate(){

    const val = input.value.trim();

    // 空欄ならクリア
    if(val === ""){
        document.getElementById("barcode").innerHTML = "";
        document.getElementById("value").textContent = "";
        return;
    }

    // 数字のみ（元仕様維持）
    if(!/^[0-9]+$/.test(val)){
        return;
    }

    JsBarcode("#barcode", val, {
        format: "CODE39",
        displayValue: true,
        width: 2,
        height: 100,
        margin: 10
    });

    // ===== バーコード下の数字にフォントを適用 =====
    const barcode = document.getElementById("barcode");

    barcode.querySelectorAll("text").forEach(text => {
        text.style.fontFamily = '"やさしさゴシック", sans-serif';
    });

    document.getElementById("value").textContent = val;
}
</script>

<script>
// ===== SVGを画像化する共通処理 =====
function createBarcodeImage(callback){

    const svg = document.getElementById("barcode");

    if(!svg.innerHTML.trim()){
        alert("バーコードを生成してください");
        return;
    }

    // SVGをコピー
    const clonedSvg = svg.cloneNode(true);

    // SVG内の数字にフォントを指定
    clonedSvg.querySelectorAll("text").forEach(text => {
        text.setAttribute(
            "font-family",
            "やさしさゴシック, sans-serif"
        );
        text.style.fontFamily =
            '"やさしさゴシック", sans-serif';
    });

    // フォント指定用のstyleをSVG内にも追加
    const style = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "style"
    );

    style.textContent = `
        text {
            font-family: "やさしさゴシック", sans-serif !important;
        }
    `;

    clonedSvg.insertBefore(
        style,
        clonedSvg.firstChild
    );

    const xml = new XMLSerializer()
        .serializeToString(clonedSvg);

    const img = new Image();

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    img.onload = async () => {

        canvas.width = img.width || 300;
        canvas.height = img.height || 150;

        ctx.drawImage(img,0,0);

        callback(canvas);
    };

    img.onerror = () => {
        alert("画像の生成に失敗しました");
    };

    img.src =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(xml);
}
</script>

<script>
// ===== 画像コピー =====
async function copyImage(){

    createBarcodeImage(async (canvas) => {

        try {

            const blob = await new Promise(resolve =>
                canvas.toBlob(resolve, "image/png")
            );

            await navigator.clipboard.write([
                new ClipboardItem({
                    "image/png": blob
                })
            ]);

            alert("バーコード画像をコピーしました");

        } catch(e) {

            alert(
                "このブラウザでは画像コピーに対応していません"
            );

        }

    });
}
</script>

<script>
// ===== PNGダウンロード =====
function downloadPNG(){

    createBarcodeImage((canvas) => {

        const a = document.createElement("a");

        a.download = "barcode.png";

        a.href =
            canvas.toDataURL("image/png");

        a.click();

    });
}
</script>

</body>
</html>
