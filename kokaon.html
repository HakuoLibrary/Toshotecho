<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>効果音プレイヤー</title>

  <style>
    :root {
      --bg: #f5f5f5;
      --fg: #222;
      --card: #ffffff;
      --accent: #1976d2;
      --danger: #c62828;
      --border: #dddddd;
      --select-bg: rgba(25,118,210,0.15);
      --select-border: #1976d2;
      --blue-light: #4fc3f7;
      --input-bg: #ffffff;
      --input-fg: #222;
      --progress-bg: #d5d5d5;
    }

    :root[data-theme="dark"] {
      --bg: #181818;
      --fg: #f5f5f5;
      --card: #242424;
      --accent: #64b5f6;
      --danger: #ef5350;
      --border: #444444;
      --select-bg: rgba(100,181,246,0.2);
      --select-border: #64b5f6;
      --blue-light: #4fc3f7;
      --input-bg: #333333;
      --input-fg: #ffffff;
      --progress-bg: #555555;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    /* =========================================
       ボタン共通アニメーション
       ========================================= */

    button,
    .file-upload-label {
      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
    }

    button:hover,
    .file-upload-label:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    button:active,
    .file-upload-label:active {
      transform: scale(0.95);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* =========================================
       右上
       ========================================= */

    .top-right-controls {
      position: fixed;
      top: 10px;
      right: 10px;

      display: flex;
      align-items: center;
      gap: 10px;

      z-index: 5000;
    }

    #batteryInfo {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 16px;
      white-space: nowrap;
    }

    #btBattery {
      display: none;
    }

    .battery-green {
      color: #4caf50;
      font-weight: bold;
    }

    .battery-red {
      color: #e53935;
      font-weight: bold;
    }

    .icon-btn {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      border: 1px solid var(--border);

      background: var(--card);
      color: var(--fg);

      font-size: 22px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================
       ＋メニュー
       ========================================= */

    .plus-menu-wrapper {
      position: relative;
    }

    .plus-menu {
      position: absolute;

      top: 52px;
      right: 0;

      width: 280px;

      padding: 8px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow: 0 8px 25px rgba(0,0,0,0.25);

      display: none;

      z-index: 6000;
    }

    .plus-menu.show {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .plus-menu-item {
      width: 100%;

      padding: 13px 15px;

      border: 1px solid transparent;
      border-radius: 8px;

      background: transparent;
      color: var(--fg);

      font-size: 16px;
      text-align: left;

      cursor: pointer;
    }

    .plus-menu-item:hover {
      background: var(--select-bg);
      border-color: var(--border);
    }

    /* =========================================
       タイトル
       ========================================= */

    h1 {
      text-align: center;

      margin-top: 70px;
      margin-bottom: 20px;

      font-size: 32px;
    }

    /* =========================================
       ツールバー
       ========================================= */

    .toolbar {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 0 20px 10px;
    }

    #searchInput {
      flex: 1;

      padding: 10px 12px;

      font-size: 16px;

      border-radius: 7px;
      border: 1px solid var(--border);

      background: var(--input-bg);
      color: var(--input-fg);
    }

    .small-btn {
      padding: 8px 12px;

      border-radius: 999px;

      border: 1px solid var(--border);

      background: var(--card);
      color: var(--fg);

      cursor: pointer;

      font-size: 14px;

      white-space: nowrap;
    }

    .small-btn:hover {
      background: var(--select-bg);
    }

    /* =========================================
       効果音リスト
       ========================================= */

    .full-list {
      height: calc(100vh - 205px);

      overflow-y: auto;

      padding:
        0
        20px
        180px;
    }

    .sfx-list {
      list-style: none;

      padding: 0;
      margin: 0;
    }

    .sfx-item {
      padding: 12px 14px;
      margin-bottom: 12px;

      border: 1px solid var(--border);
      border-radius: 8px;

      font-size: 18px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--card);

      transition: all 0.25s ease;

      max-height: 80px;

      position: relative;
    }

    .sfx-item.selected {
      background: var(--select-bg);

      border-left:
        6px solid
        var(--select-border);

      font-weight: bold;
    }

    .sfx-item.fade-out {
      opacity: 0;

      transform: scale(0.95);

      max-height: 0;

      margin: 0;

      padding-top: 0;
      padding-bottom: 0;

      border-width: 0;
    }

    .sfx-item.dragging {
      box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

      transform: scale(1.03);

      z-index: 2000;
    }

    .sfx-name {
      flex: 1;

      margin-right: 10px;

      word-break: break-all;
    }

    .row-buttons {
      display: flex;
      align-items: center;

      gap: 6px;
    }

    .row-btn {
      padding: 4px 8px;

      border-radius: 6px;

      border: 1px solid var(--border);

      background: transparent;
      color: var(--fg);

      font-size: 12px;

      cursor: pointer;
    }

    .delete-btn {
      border-color: var(--danger);
      color: var(--danger);
    }

    .drop-indicator {
      height: 4px;

      background: var(--accent);

      border-radius: 2px;

      margin: 4px 0;

      opacity: 0;

      transition: opacity 0.15s ease;
    }

    .drop-indicator.show {
      opacity: 1;
    }

    /* =========================================
       下部プレイヤー
       
       1段目：
       再生 / 停止 / 音量

       2段目：
       時間 / シークバー / 10秒戻る / 10秒進む
       ========================================= */

    .bottom-bar {
      position: fixed;

      left: 0;
      bottom: 0;

      width: 100%;

      background: var(--card);

      border-top:
        1px solid
        var(--border);

      box-shadow:
        0 -4px 15px
        rgba(0,0,0,0.08);

      padding: 9px 20px;

      display: flex;
      flex-direction: column;

      gap: 7px;

      z-index: 4000;
    }

    /* =========================================
       1段目
       ========================================= */

    .player-main-row {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 14px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;
    }

    /* =========================================
       再生・停止ボタン
       ========================================= */

    .btn {
      padding: 12px 26px;

      border-radius: 999px;

      border: 3px solid var(--border);

      background: var(--card);
      color: var(--fg);

      font-size: 22px;

      cursor: pointer;

      font-weight: bold;

      white-space: nowrap;
    }

    #playBtn {
      min-width: 145px;

      border-color: var(--accent);
      color: var(--accent);
    }

    #stopAllBtn {
      min-width: 120px;

      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-blue {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-red {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* =========================================
       音量
       ========================================= */

    .volume-wrapper {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-left: 20px;
    }

    .volume-label {
      font-size: 17px;
      white-space: nowrap;
    }

    #volumeControl {
      width: 180px;
      height: 10px;

      accent-color: var(--accent);

      cursor: pointer;
    }

    #volumePercent {
      min-width: 45px;

      font-size: 17px;
      font-weight: bold;

      font-variant-numeric:
        tabular-nums;
    }

    /* =========================================
       2段目
       ========================================= */

    .player-progress-row {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .player-time {
      min-width: 105px;

      text-align: center;

      font-size: 15px;

      font-weight: bold;

      font-variant-numeric:
        tabular-nums;

      white-space: nowrap;
    }

    #progressControl {
      flex: 1;

      min-width: 100px;

      width: 100%;

      height: 10px;

      accent-color: var(--accent);

      cursor: pointer;
    }

    .player-skip-btn {
      min-width: 90px;

      padding: 8px 12px;

      font-size: 14px;
    }

    /* =========================================
       モーダル
       ========================================= */

    .modal {
      position: fixed;

      inset: 0;

      background: var(--bg);

      padding: 40px;

      display: none;

      flex-direction: column;

      z-index: 7000;

      overflow-y: auto;
    }

    .modal.show {
      display: flex;
    }

    .modal h2 {
      text-align: center;

      margin-bottom: 30px;
    }

    .file-upload-label {
      display: inline-block;

      padding: 12px 18px;

      width: 200px;

      margin-bottom: 20px;

      background: var(--blue-light);

      color: white;

      border-radius: 8px;

      cursor: pointer;

      font-size: 18px;

      text-align: center;

      box-shadow:
        0 2px 6px
        rgba(0,0,0,0.15);
    }

    #selectedCount {
      margin-left: 12px;

      font-size: 16px;

      opacity: 0.8;
    }

    #fileInput {
      display: none;
    }

    .modal input[type="text"] {
      width: 100%;

      padding: 12px;

      margin-bottom: 20px;

      font-size: 20px;

      background: var(--input-bg);
      color: var(--input-fg);

      border:
        1px solid
        var(--border);

      border-radius: 6px;
    }

    .modal-buttons {
      display: flex;

      justify-content: center;

      gap: 20px;

      margin-top: 10px;
    }

    .modal-buttons .btn {
      width: 120px;

      padding: 10px 18px;

      font-size: 18px;

      text-align: center;
    }

    /* =========================================
       削除確認
       ========================================= */

    .confirm-modal {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.5);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 8000;
    }

    .confirm-modal.show {
      display: flex;
    }

    .confirm-box {
      width: 300px;

      padding: 30px;

      background: var(--card);

      border:
        1px solid
        var(--border);

      border-radius: 12px;

      text-align: center;
    }

    .confirm-buttons {
      display: flex;

      justify-content: center;

      gap: 20px;

      margin-top: 20px;
    }

    /* =========================================
       タブレット
       ========================================= */

    @media (max-width: 1000px) {

      .player-main-row {
        gap: 8px;
      }

      .volume-wrapper {
        margin-left: 5px;
      }

      #volumeControl {
        width: 130px;
      }

      #playBtn {
        min-width: 125px;
        padding: 11px 18px;
      }

      #stopAllBtn {
        min-width: 105px;
        padding: 11px 18px;
      }
    }

    /* =========================================
       スマートフォン
       ========================================= */

    @media (max-width: 650px) {

      .top-right-controls {
        top: 6px;
        right: 6px;

        gap: 5px;
      }

      #batteryInfo {
        display: none;
      }

      h1 {
        font-size: 26px;

        margin-top: 65px;
      }

      .toolbar {
        padding-left: 10px;
        padding-right: 10px;
      }

      .full-list {
        padding-left: 10px;
        padding-right: 10px;

        padding-bottom: 175px;

        height: calc(100vh - 190px);
      }

      .sfx-item {
        font-size: 16px;
      }

      .row-btn {
        padding: 4px 6px;
      }

      .bottom-bar {
        padding: 7px 8px;

        gap: 6px;
      }

      .player-main-row {
        gap: 6px;
      }

      .player-controls {
        gap: 5px;
      }

      #playBtn {
        min-width: 105px;

        padding: 9px 12px;

        font-size: 18px;
      }

      #stopAllBtn {
        min-width: 90px;

        padding: 9px 12px;

        font-size: 18px;
      }

      .volume-wrapper {
        margin-left: 0;

        gap: 5px;
      }

      .volume-label {
        display: none;
      }

      #volumeControl {
        width: 100px;
      }

      #volumePercent {
        min-width: 35px;

        font-size: 14px;
      }

      .player-progress-row {
        gap: 5px;
      }

      .player-time {
        min-width: 78px;

        font-size: 12px;
      }

      .player-skip-btn {
        min-width: 65px;

        padding: 7px 6px;

        font-size: 11px;
      }

      .plus-menu {
        width: 250px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       右上コントロール
       ========================================= -->

  <div class="top-right-controls">

    <div id="batteryInfo">

      <div id="pcBattery">
        PC充電残量：取得中…
      </div>

      <div id="btBattery">
        📡Bluetooth充電残量：取得中…
      </div>

    </div>


    <button
      id="themeToggleBtn"
      class="icon-btn"
      title="テーマ切替"
    >
      🌗
    </button>


    <button
      id="fullscreenBtn"
      class="icon-btn"
      title="全画面"
    >
      ⛶
    </button>


    <!-- ＋メニュー -->

    <div class="plus-menu-wrapper">

      <button
        id="openAddPanelBtn"
        class="icon-btn"
        style="font-size:28px;"
        title="メニュー"
      >
        ＋
      </button>


      <div id="plusMenu" class="plus-menu">

        <button
          id="menuAddSfxBtn"
          class="plus-menu-item"
        >
          ＋ 効果音を追加
        </button>


        <button
          id="menuBtConnectBtn"
          class="plus-menu-item"
        >
          🔋 Bluetooth充電残量取得
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================
       タイトル
       ========================================= -->

  <h1>
    効果音プレイヤー
  </h1>


  <!-- =========================================
       検索
       ========================================= -->

  <div class="toolbar">

    <input
      id="searchInput"
      type="text"
      placeholder="効果音を検索"
    >


    <button
      id="clearSearchBtn"
      class="small-btn"
    >
      ✕
    </button>


    <button
      id="sortByNameBtn"
      class="small-btn"
    >
      名前順
    </button>

  </div>


  <!-- =========================================
       効果音一覧
       ========================================= -->

  <div class="full-list">

    <ul
      id="sfxList"
      class="sfx-list"
    >

      <li
        id="emptyMessage"
        style="
          padding:12px;
          text-align:center;
          opacity:0.7;
        "
      >
        右上の＋ボタンを押して
        効果音を選択してください
      </li>

    </ul>

  </div>


  <!-- =========================================
       下部プレイヤー
       ========================================= -->

  <div class="bottom-bar">


    <!-- =====================================
         1段目
         再生・停止・音量
         ===================================== -->

    <div class="player-main-row">

      <div class="player-controls">

        <button
          id="playBtn"
          class="btn btn-blue"
        >
          ▶ 再生
        </button>


        <button
          id="stopAllBtn"
          class="btn btn-red"
        >
          ■ 停止
        </button>

      </div>


      <div class="volume-wrapper">

        <span class="volume-label">
          音量
        </span>


        <input
          id="volumeControl"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.5"
        >


        <span id="volumePercent">
          50%
        </span>

      </div>

    </div>


    <!-- =====================================
         2段目
         時間・シーク・10秒戻る・10秒進む
         ===================================== -->

    <div class="player-progress-row">


      <div class="player-time">

        <span id="currentTime">
          00:00
        </span>

        <span>
          /
        </span>

        <span id="durationTime">
          00:00
        </span>

      </div>


      <input
        id="progressControl"
        type="range"
        min="0"
        max="100"
        step="0.1"
        value="0"
        aria-label="再生位置"
      >


      <button
        id="rewindBtn"
        class="small-btn player-skip-btn"
      >
        ↶ 10秒
      </button>


      <button
        id="forwardBtn"
        class="small-btn player-skip-btn"
      >
        10秒 ↷
      </button>

    </div>

  </div>


  <!-- =========================================
       効果音追加モーダル
       ========================================= -->

  <div
    id="addModal"
    class="modal"
  >

    <h2>
      効果音を追加
    </h2>


    <div>

      <label
        for="fileInput"
        class="file-upload-label"
      >
        ファイルを選択
      </label>


      <span id="selectedCount"></span>

    </div>


    <input
      id="fileInput"
      type="file"
      accept="audio/*"
      multiple
    >


    <input
      id="displayNameInput"
      type="text"
      placeholder="表示名（任意）"
    >


    <div class="modal-buttons">

      <button
        id="addSfxBtn"
        class="btn btn-blue"
      >
        追加
      </button>


      <button
        id="closeModalBtn"
        class="btn btn-red"
      >
        閉じる
      </button>

    </div>

  </div>


  <!-- =========================================
       削除確認
       ========================================= -->

  <div
    id="confirmModal"
    class="confirm-modal"
  >

    <div class="confirm-box">

      <p id="confirmText"></p>


      <div class="confirm-buttons">

        <button
          id="confirmYes"
          class="btn btn-red"
        >
          削除
        </button>


        <button
          id="confirmNo"
          class="btn btn-blue"
        >
          キャンセル
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       DOM取得
       ===================================================== */

    const root =
      document.documentElement;


    const themeToggleBtn =
      document.getElementById(
        "themeToggleBtn"
      );


    const fullscreenBtn =
      document.getElementById(
        "fullscreenBtn"
      );


    const openAddPanelBtn =
      document.getElementById(
        "openAddPanelBtn"
      );


    const plusMenu =
      document.getElementById(
        "plusMenu"
      );


    const menuAddSfxBtn =
      document.getElementById(
        "menuAddSfxBtn"
      );


    const menuBtConnectBtn =
      document.getElementById(
        "menuBtConnectBtn"
      );


    const addModal =
      document.getElementById(
        "addModal"
      );


    const closeModalBtn =
      document.getElementById(
        "closeModalBtn"
      );


    const confirmModal =
      document.getElementById(
        "confirmModal"
      );


    const confirmText =
      document.getElementById(
        "confirmText"
      );


    const confirmYes =
      document.getElementById(
        "confirmYes"
      );


    const confirmNo =
      document.getElementById(
        "confirmNo"
      );


    const fileInput =
      document.getElementById(
        "fileInput"
      );


    const displayNameInput =
      document.getElementById(
        "displayNameInput"
      );


    const addSfxBtn =
      document.getElementById(
        "addSfxBtn"
      );


    const sfxList =
      document.getElementById(
        "sfxList"
      );


    const emptyMessage =
      document.getElementById(
        "emptyMessage"
      );


    const selectedCount =
      document.getElementById(
        "selectedCount"
      );


    const volumeControl =
      document.getElementById(
        "volumeControl"
      );


    const volumePercent =
      document.getElementById(
        "volumePercent"
      );


    const stopAllBtn =
      document.getElementById(
        "stopAllBtn"
      );


    const playBtn =
      document.getElementById(
        "playBtn"
      );


    const rewindBtn =
      document.getElementById(
        "rewindBtn"
      );


    const forwardBtn =
      document.getElementById(
        "forwardBtn"
      );


    const progressControl =
      document.getElementById(
        "progressControl"
      );


    const currentTimeEl =
      document.getElementById(
        "currentTime"
      );


    const durationTimeEl =
      document.getElementById(
        "durationTime"
      );


    const pcBatteryEl =
      document.getElementById(
        "pcBattery"
      );


    const btBatteryEl =
      document.getElementById(
        "btBattery"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const clearSearchBtn =
      document.getElementById(
        "clearSearchBtn"
      );


    const sortByNameBtn =
      document.getElementById(
        "sortByNameBtn"
      );


    /* =====================================================
       状態
       ===================================================== */

    let sfxItems = [];

    let nextId = 0;

    let selectedId = null;

    let draggedLi = null;


    const dropIndicator =
      document.createElement(
        "div"
      );


    dropIndicator.className =
      "drop-indicator";


    /* =====================================================
       ＋メニュー
       ===================================================== */

    openAddPanelBtn.onclick = (e) => {

      e.stopPropagation();

      plusMenu.classList.toggle(
        "show"
      );

    };


    document.addEventListener(
      "click",
      (e) => {

        if (
          !e.target.closest(
            ".plus-menu-wrapper"
          )
        ) {

          plusMenu.classList.remove(
            "show"
          );

        }

      }
    );


    /* =====================================================
       効果音追加メニュー
       ===================================================== */

    menuAddSfxBtn.onclick = () => {

      plusMenu.classList.remove(
        "show"
      );

      addModal.classList.add(
        "show"
      );

    };


    /* =====================================================
       PCバッテリー
       ===================================================== */

    if (navigator.getBattery) {

      navigator.getBattery()
        .then(battery => {

          function updatePcBattery() {

            const level =
              Math.round(
                battery.level * 100
              );


            const charging =
              battery.charging
                ? "（充電中）"
                : "";


            pcBatteryEl.textContent =
              `PC充電残量：${level}% ${charging}`;


            if (level >= 21) {

              pcBatteryEl.classList.add(
                "battery-green"
              );

              pcBatteryEl.classList.remove(
                "battery-red"
              );

            } else {

              pcBatteryEl.classList.add(
                "battery-red"
              );

              pcBatteryEl.classList.remove(
                "battery-green"
              );

            }

          }


          updatePcBattery();


          battery.addEventListener(
            "levelchange",
            updatePcBattery
          );


          battery.addEventListener(
            "chargingchange",
            updatePcBattery
          );

        });

    } else {

      pcBatteryEl.textContent =
        "PC充電残量：取得不可";

    }


    /* =====================================================
       Bluetoothバッテリー
       ===================================================== */

    async function connectBluetoothBattery() {

      try {

        if (
          !navigator.bluetooth
        ) {

          alert(
            "このブラウザーではBluetooth機能を利用できません。"
          );

          return;

        }


        const device =
          await navigator.bluetooth.requestDevice({

            filters: [
              {
                services: [
                  "battery_service"
                ]
              }
            ]

          });


        const server =
          await device.gatt.connect();


        const service =
          await server.getPrimaryService(
            "battery_service"
          );


        const characteristic =
          await service.getCharacteristic(
            "battery_level"
          );


        async function updateBtBattery() {

          const value =
            await characteristic.readValue();


          const level =
            value.getUint8(0);


          btBatteryEl.style.display =
            "block";


          btBatteryEl.textContent =
            `Bluetooth充電残量：${level}%`;


          if (level >= 21) {

            btBatteryEl.classList.add(
              "battery-green"
            );

            btBatteryEl.classList.remove(
              "battery-red"
            );

          } else {

            btBatteryEl.classList.add(
              "battery-red"
            );

            btBatteryEl.classList.remove(
              "battery-green"
            );

          }

        }


        await updateBtBattery();


        characteristic.addEventListener(
          "characteristicvaluechanged",
          updateBtBattery
        );


        await characteristic.startNotifications();


      } catch (error) {

        console.log(
          "Bluetooth取得失敗:",
          error
        );

      }

    }


    menuBtConnectBtn.onclick = () => {

      plusMenu.classList.remove(
        "show"
      );

      connectBluetoothBattery();

    };


    /* =====================================================
       テーマ切替
       ===================================================== */

    themeToggleBtn.onclick = () => {

      const now =
        root.getAttribute(
          "data-theme"
        ) === "dark"
          ? "light"
          : "dark";


      root.setAttribute(
        "data-theme",
        now
      );


      localStorage.setItem(
        "theme",
        now
      );

    };


    root.setAttribute(
      "data-theme",
      localStorage.getItem(
        "theme"
      ) || "light"
    );


    /* =====================================================
       全画面
       ===================================================== */

    fullscreenBtn.onclick = () => {

      if (
        !document.fullscreenElement
      ) {

        document.documentElement
          .requestFullscreen()
          .catch(error => {

            console.log(
              "全画面化できません:",
              error
            );

          });

      } else {

        document.exitFullscreen();

      }

    };


    /* =====================================================
       モーダル
       ===================================================== */

    closeModalBtn.onclick = () => {

      addModal.classList.remove(
        "show"
      );

    };


    fileInput.onchange = () => {

      const count =
        fileInput.files.length;


      selectedCount.textContent =
        count > 0
          ? `${count} 個選択中`
          : "";

    };


    /* =====================================================
       削除確認
       ===================================================== */

    function openConfirmModal(
      name,
      onConfirm
    ) {

      confirmText.textContent =
        `${name} を削除しますか？`;


      confirmModal.classList.add(
        "show"
      );


      confirmYes.onclick = () => {

        confirmModal.classList.remove(
          "show"
        );

        onConfirm();

      };


      confirmNo.onclick = () => {

        confirmModal.classList.remove(
          "show"
        );

      };

    }


    /* =====================================================
       時間フォーマット
       ===================================================== */

    function formatTime(seconds) {

      if (
        !Number.isFinite(seconds) ||
        seconds < 0
      ) {

        return "00:00";

      }


      const totalSeconds =
        Math.floor(seconds);


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const secs =
        totalSeconds % 60;


      return (
        String(minutes).padStart(
          2,
          "0"
        ) +
        ":" +
        String(secs).padStart(
          2,
          "0"
        )
      );

    }


    /* =====================================================
       プレイヤー表示
       ===================================================== */

    function updatePlayerDisplay(
      audio
    ) {

      if (!audio) {

        currentTimeEl.textContent =
          "00:00";


        durationTimeEl.textContent =
          "00:00";


        progressControl.value =
          0;


        return;

      }


      const current =
        audio.currentTime || 0;


      const duration =
        audio.duration || 0;


      currentTimeEl.textContent =
        formatTime(current);


      durationTimeEl.textContent =
        formatTime(duration);


      if (
        Number.isFinite(duration) &&
        duration > 0
      ) {

        progressControl.value =
          (
            current /
            duration
          ) * 100;

      } else {

        progressControl.value =
          0;

      }

    }


    /* =====================================================
       再生ボタン表示
       ===================================================== */

    function updatePlayButton(
      audio
    ) {

      if (
        audio &&
        !audio.paused
      ) {

        playBtn.textContent =
          "⏸ 一時停止";

      } else {

        playBtn.textContent =
          "▶ 再生";

      }

    }


    /* =====================================================
       Audioイベント設定
       ===================================================== */

    function setupAudioEvents(
      item
    ) {

      const audio =
        item.audio;


      audio.addEventListener(
        "loadedmetadata",
        () => {

          if (
            selectedId === item.id
          ) {

            updatePlayerDisplay(
              audio
            );

          }

        }
      );


      audio.addEventListener(
        "durationchange",
        () => {

          if (
            selectedId === item.id
          ) {

            updatePlayerDisplay(
              audio
            );

          }

        }
      );


      audio.addEventListener(
        "timeupdate",
        () => {

          if (
            selectedId === item.id
          ) {

            updatePlayerDisplay(
              audio
            );

          }

        }
      );


      audio.addEventListener(
        "play",
        () => {

          if (
            selectedId === item.id
          ) {

            updatePlayButton(
              audio
            );

          }

        }
      );


      audio.addEventListener(
        "pause",
        () => {

          if (
            selectedId === item.id
          ) {

            updatePlayButton(
              audio
            );

          }

        }
      );


      audio.addEventListener(
        "ended",
        () => {

          if (
            selectedId === item.id
          ) {

            audio.currentTime =
              0;


            updatePlayerDisplay(
              audio
            );


            updatePlayButton(
              audio
            );

          }

        }
      );

    }


    /* =====================================================
       音量
       ===================================================== */

    function updateVolumePercent() {

      volumePercent.textContent =
        Math.round(
          volumeControl.value * 100
        ) + "%";

    }


    updateVolumePercent();


    volumeControl.oninput = () => {

      updateVolumePercent();


      sfxItems.forEach(
        item => {

          if (item) {

            item.audio.volume =
              Number(
                volumeControl.value
              );

          }

        }
      );

    };


    /* =====================================================
       並び順同期
       ===================================================== */

    function syncOrderFromDOM() {

      const orderIds =
        [
          ...document.querySelectorAll(
            ".sfx-item"
          )
        ].map(
          li =>
            Number(
              li.dataset.id
            )
        );


      sfxItems.sort(
        (a, b) =>
          orderIds.indexOf(a.id) -
          orderIds.indexOf(b.id)
      );

    }


    /* =====================================================
       効果音アイテム作成
       ===================================================== */

    function createSfxItem(
      file,
      customName
    ) {

      const url =
        URL.createObjectURL(
          file
        );


      const audio =
        new Audio(url);


      audio.volume =
        Number(
          volumeControl.value
        );


      const name =
        customName ||
        file.name;


      const id =
        nextId++;


      const li =
        document.createElement(
          "li"
        );


      li.className =
        "sfx-item";


      li.draggable =
        true;


      li.dataset.id =
        id;


      const nameSpan =
        document.createElement(
          "span"
        );


      nameSpan.className =
        "sfx-name";


      nameSpan.textContent =
        name;


      const btnWrap =
        document.createElement(
          "div"
        );


      btnWrap.className =
        "row-buttons";


      const upBtn =
        document.createElement(
          "button"
        );


      upBtn.textContent =
        "▲";


      upBtn.className =
        "row-btn";


      const downBtn =
        document.createElement(
          "button"
        );


      downBtn.textContent =
        "▼";


      downBtn.className =
        "row-btn";


      const deleteBtn =
        document.createElement(
          "button"
        );


      deleteBtn.textContent =
        "削除";


      deleteBtn.className =
        "row-btn delete-btn";


      btnWrap.appendChild(
        upBtn
      );

      btnWrap.appendChild(
        downBtn
      );

      btnWrap.appendChild(
        deleteBtn
      );


      li.appendChild(
        nameSpan
      );

      li.appendChild(
        btnWrap
      );


      const item = {
        id,
        audio,
        name,
        li,
        url
      };


      sfxItems.push(
        item
      );


      setupAudioEvents(
        item
      );


      /* =====================================
         効果音選択
         ===================================== */

      li.addEventListener(
        "click",
        (e) => {

          if (
            e.target === upBtn ||
            e.target === downBtn ||
            e.target === deleteBtn
          ) {

            return;

          }


          /*
           * 他の効果音を停止
           */

          sfxItems.forEach(
            otherItem => {

              if (
                otherItem.id !== id
              ) {

                otherItem.audio.pause();

                otherItem.audio.currentTime =
                  0;

              }

            }
          );


          document
            .querySelectorAll(
              ".sfx-item"
            )
            .forEach(
              el =>
                el.classList.remove(
                  "selected"
                )
            );


          li.classList.add(
            "selected"
          );


          selectedId =
            id;


          updatePlayerDisplay(
            audio
          );


          updatePlayButton(
            audio
          );

        }
      );


      /* =====================================
         上へ
         ===================================== */

      upBtn.onclick = (e) => {

        e.stopPropagation();


        const prev =
          li.previousElementSibling;


        if (
          prev &&
          prev !== emptyMessage
        ) {

          sfxList.insertBefore(
            li,
            prev
          );


          syncOrderFromDOM();

        }

      };


      /* =====================================
         下へ
         ===================================== */

      downBtn.onclick = (e) => {

        e.stopPropagation();


        const next =
          li.nextElementSibling;


        if (next) {

          sfxList.insertBefore(
            next,
            li
          );


          syncOrderFromDOM();

        }

      };


      /* =====================================
         削除
         ===================================== */

      deleteBtn.onclick = (e) => {

        e.stopPropagation();


        openConfirmModal(
          name,
          () => {

            audio.pause();

            audio.currentTime =
              0;


            if (
              selectedId === id
            ) {

              selectedId =
                null;


              updatePlayerDisplay(
                null
              );


              playBtn.textContent =
                "▶ 再生";

            }


            li.classList.add(
              "fade-out"
            );


            setTimeout(
              () => {

                li.remove();


                sfxItems =
                  sfxItems.filter(
                    it =>
                      it.id !== id
                  );


                if (
                  !sfxList.querySelector(
                    ".sfx-item"
                  )
                ) {

                  sfxList.appendChild(
                    emptyMessage
                  );

                }


                syncOrderFromDOM();


                URL.revokeObjectURL(
                  url
                );

              },
              250
            );

          }
        );

      };


      /* =====================================
         ドラッグ開始
         ===================================== */

      li.addEventListener(
        "dragstart",
        () => {

          draggedLi =
            li;


          li.classList.add(
            "dragging"
          );

        }
      );


      /* =====================================
         ドラッグ終了
         ===================================== */

      li.addEventListener(
        "dragend",
        () => {

          li.classList.remove(
            "dragging"
          );


          draggedLi =
            null;


          dropIndicator.remove();


          syncOrderFromDOM();

        }
      );


      /* =====================================
         ドラッグ中
         ===================================== */

      li.addEventListener(
        "dragover",
        (e) => {

          e.preventDefault();


          if (
            !draggedLi ||
            draggedLi === li
          ) {

            return;

          }


          const rect =
            li.getBoundingClientRect();


          const offset =
            e.clientY -
            rect.top;


          const before =
            offset <
            rect.height / 2;


          dropIndicator.classList.add(
            "show"
          );


          if (before) {

            sfxList.insertBefore(
              dropIndicator,
              li
            );

          } else {

            sfxList.insertBefore(
              dropIndicator,
              li.nextSibling
            );

          }

        }
      );


      /* =====================================
         ドロップ
         ===================================== */

      li.addEventListener(
        "drop",
        (e) => {

          e.preventDefault();


          if (
            !draggedLi ||
            draggedLi === li
          ) {

            return;

          }


          const before =
            dropIndicator.nextSibling ===
            li;


          if (before) {

            sfxList.insertBefore(
              draggedLi,
              li
            );

          } else {

            sfxList.insertBefore(
              draggedLi,
              li.nextSibling
            );

          }


          dropIndicator.remove();


          syncOrderFromDOM();

        }
      );


      return item;

    }


    /* =====================================================
       効果音追加
       ===================================================== */

    addSfxBtn.onclick = () => {

      const files =
        fileInput.files;


      if (!files.length) {

        alert(
          "ファイルを選択してください"
        );

        return;

      }


      const customName =
        displayNameInput.value.trim();


      [
        ...files
      ].forEach(
        file => {

          const item =
            createSfxItem(
              file,
              customName
            );


          if (
            emptyMessage.parentNode
          ) {

            emptyMessage.remove();

          }


          sfxList.appendChild(
            item.li
          );

        }
      );


      selectedCount.textContent =
        "";


      fileInput.value =
        "";


      displayNameInput.value =
        "";


      addModal.classList.remove(
        "show"
      );


      syncOrderFromDOM();

    };


    /* =====================================================
       再生 / 一時停止
       ===================================================== */

    playBtn.onclick = () => {

      const item =
        sfxItems.find(
          i =>
            i &&
            i.id === selectedId
        );


      if (!item) {

        alert(
          "再生する効果音を一覧から選択してください"
        );

        return;

      }


      const audio =
        item.audio;


      if (audio.paused) {

        audio.play()
          .catch(error => {

            console.log(
              "再生エラー:",
              error
            );

          });

      } else {

        audio.pause();

      }


      updatePlayButton(
        audio
      );

    };


    /* =====================================================
       停止
       ===================================================== */

    stopAllBtn.onclick = () => {

      sfxItems.forEach(
        item => {

          if (item) {

            item.audio.pause();

            item.audio.currentTime =
              0;

          }

        }
      );


      const selectedItem =
        sfxItems.find(
          i =>
            i &&
            i.id === selectedId
        );


      if (selectedItem) {

        updatePlayerDisplay(
          selectedItem.audio
        );


        updatePlayButton(
          selectedItem.audio
        );

      } else {

        updatePlayerDisplay(
          null
        );


        playBtn.textContent =
          "▶ 再生";

      }

    };


    /* =====================================================
       10秒巻き戻し
       ===================================================== */

    rewindBtn.onclick = () => {

      const item =
        sfxItems.find(
          i =>
            i &&
            i.id === selectedId
        );


      if (!item) {

        return;

      }


      item.audio.currentTime =
        Math.max(
          0,
          item.audio.currentTime - 10
        );


      updatePlayerDisplay(
        item.audio
      );

    };


    /* =====================================================
       10秒スキップ
       ===================================================== */

    forwardBtn.onclick = () => {

      const item =
        sfxItems.find(
          i =>
            i &&
            i.id === selectedId
        );


      if (!item) {

        return;

      }


      const duration =
        item.audio.duration;


      if (
        Number.isFinite(duration)
      ) {

        item.audio.currentTime =
          Math.min(
            duration,
            item.audio.currentTime + 10
          );

      } else {

        item.audio.currentTime +=
          10;

      }


      updatePlayerDisplay(
        item.audio
      );

    };


    /* =====================================================
       シークバー
       ===================================================== */

    progressControl.oninput = () => {

      const item =
        sfxItems.find(
          i =>
            i &&
            i.id === selectedId
        );


      if (
        !item ||
        !Number.isFinite(
          item.audio.duration
        )
      ) {

        return;

      }


      const percent =
        Number(
          progressControl.value
        ) / 100;


      item.audio.currentTime =
        item.audio.duration *
        percent;


      updatePlayerDisplay(
        item.audio
      );

    };


    /* =====================================================
       検索
       ===================================================== */

    searchInput.oninput = () => {

      const q =
        searchInput.value
          .toLowerCase();


      document
        .querySelectorAll(
          ".sfx-item"
        )
        .forEach(
          li => {

            const name =
              li.querySelector(
                ".sfx-name"
              )
              .textContent
              .toLowerCase();


            li.style.display =
              name.includes(q)
                ? ""
                : "none";

          }
        );

    };


    clearSearchBtn.onclick = () => {

      searchInput.value =
        "";


      document
        .querySelectorAll(
          ".sfx-item"
        )
        .forEach(
          li => {

            li.style.display =
              "";

          }
        );

    };


    /* =====================================================
       名前順
       ===================================================== */

    sortByNameBtn.onclick = () => {

      const lis =
        [
          ...document.querySelectorAll(
            ".sfx-item"
          )
        ];


      lis.sort(
        (a, b) => {

          const na =
            a.querySelector(
              ".sfx-name"
            )
            .textContent
            .toLowerCase();


          const nb =
            b.querySelector(
              ".sfx-name"
            )
            .textContent
            .toLowerCase();


          return na.localeCompare(
            nb,
            "ja"
          );

        }
      );


      lis.forEach(
        li =>
          sfxList.appendChild(
            li
          )
      );


      syncOrderFromDOM();

    };


    /* =====================================================
       キーボード操作
       ===================================================== */

    document.addEventListener(
      "keydown",
      (e) => {

        /*
         * 検索・名前入力中は
         * キーボード操作を無効化
         */

        if (
          e.target.tagName ===
            "INPUT" &&
          e.target.type !==
            "range"
        ) {

          return;

        }


        const item =
          sfxItems.find(
            i =>
              i &&
              i.id === selectedId
          );


        if (!item) {

          return;

        }


        /* Space：再生 / 一時停止 */

        if (
          e.code === "Space"
        ) {

          e.preventDefault();

          playBtn.click();

        }


        /* ←：5秒戻る */

        if (
          e.code === "ArrowLeft"
        ) {

          e.preventDefault();


          item.audio.currentTime =
            Math.max(
              0,
              item.audio.currentTime - 5
            );


          updatePlayerDisplay(
            item.audio
          );

        }


        /* →：5秒進む */

        if (
          e.code === "ArrowRight"
        ) {

          e.preventDefault();


          const duration =
            item.audio.duration;


          if (
            Number.isFinite(
              duration
            )
          ) {

            item.audio.currentTime =
              Math.min(
                duration,
                item.audio.currentTime + 5
              );

          } else {

            item.audio.currentTime +=
              5;

          }


          updatePlayerDisplay(
            item.audio
          );

        }

      }
    );

  </script>
